[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fun-realtime"
version = "0.1.0"
description = "Python SDK for qwen-audio-realtime API"
requires-python = ">=3.8"
dependencies = [
    "websockets>=12.0",
]

[project.optional-dependencies]
demo = [
    "pyaudio>=0.2.13",
]

[tool.setuptools.packages.find]
include = ["fun_realtime*"]
